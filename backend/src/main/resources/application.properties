spring.application.name=quickbite-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quickbite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:quickbite}
spring.datasource.password=${DB_PASSWORD:quickbite123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
